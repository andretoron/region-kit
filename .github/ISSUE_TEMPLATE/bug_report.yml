name: Bug report
description: Report reproducible incorrect behaviour in region-kit.
title: "[Bug]: "
labels:
  - bug
body:
  - type: markdown
    attributes:
      value: |
        Thank you for reporting a bug. Do not include credentials, private datasets, or security vulnerabilities.
  - type: input
    id: version
    attributes:
      label: region-kit version
      description: Provide the installed package version or commit SHA.
      placeholder: 0.1.0
    validations:
      required: true
  - type: input
    id: node-version
    attributes:
      label: Node.js version
      placeholder: 22.x or 24.x
    validations:
      required: true
  - type: textarea
    id: description
    attributes:
      label: Description
      description: Explain what happened and what you expected instead.
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal reproduction
      description: Provide the smallest safe example that reproduces the problem.
      render: shell
    validations:
      required: true
  - type: textarea
    id: additional-context
    attributes:
      label: Additional context
      description: Add relevant logs or context after removing sensitive data.
